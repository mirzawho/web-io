name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# The publish job pushes to GitHub Container Registry, which needs an explicit
# token scope; everything else only reads the repository.
permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # The suite never launches Chromium and never talks to the network, so no
      # browser has to be installed here.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: web-io:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the browser is actually present and startable in the image.
      - name: Check Chromium
        run: docker run --rm --entrypoint /usr/bin/chromium web-io:ci --version

      - name: Check the service answers on /api/v1/health
        run: |
          docker run -d --name web-io-ci -p 3000:3000 web-io:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs web-io-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f web-io-ci

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    # Only publish from the main branch or a version tag, never from a PR.
    if: github.event_name == 'push'
    needs: [test, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Turns the git ref into tags: main -> latest + sha-<short>, v1.2.3 -> 1.2.3 + 1.2 + latest.
      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
