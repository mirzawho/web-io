name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # The suite never launches Chromium and never talks to the network, so no
      # browser has to be installed here.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: web-io:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the browser is actually present and startable in the image.
      - name: Check Chromium
        run: docker run --rm --entrypoint /usr/bin/chromium web-io:ci --version

      - name: Check the service answers on /api/v1/health
        run: |
          docker run -d --name web-io-ci -p 3000:3000 web-io:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs web-io-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f web-io-ci
